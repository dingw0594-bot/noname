<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无名杀CLI服务器管理面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            color: #666;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .rooms-section, .players-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .room-item, .player-item {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }
        
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .room-name {
            font-weight: bold;
            color: #333;
        }
        
        .room-status {
            padding: 5px 10px;
            border-radius: 15px;
            color: white;
            font-size: 0.8em;
        }
        
        .status-waiting { background: #28a745; }
        .status-playing { background: #ffc107; color: #333; }
        .status-finished { background: #6c757d; }
        
        .room-info {
            color: #666;
            font-size: 0.9em;
        }
        
        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .player-name {
            font-weight: bold;
        }
        
        .player-status {
            font-size: 0.8em;
            color: #666;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            background: #5a6fd8;
        }
        
        .empty-state {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }
        
        .connected { background: #28a745; }
        .disconnected { background: #dc3545; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .loading {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">连接中...</div>
    
    <div class="container">
        <div class="header">
            <h1>🎮 无名杀CLI服务器</h1>
            <p>实时监控面板</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>在线玩家</h3>
                <div class="stat-value" id="playerCount">0</div>
            </div>
            <div class="stat-card">
                <h3>活跃房间</h3>
                <div class="stat-value" id="roomCount">0</div>
            </div>
            <div class="stat-card">
                <h3>进行中的游戏</h3>
                <div class="stat-value" id="gameCount">0</div>
            </div>
            <div class="stat-card">
                <h3>服务器运行时间</h3>
                <div class="stat-value" id="uptime">00:00:00</div>
            </div>
        </div>
        
        <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
        
        <div class="rooms-section">
            <h2 class="section-title">房间列表</h2>
            <div id="roomsList">
                <div class="empty-state loading">正在加载房间数据...</div>
            </div>
        </div>
        
        <div class="players-section">
            <h2 class="section-title">在线玩家</h2>
            <div id="playersList">
                <div class="empty-state loading">正在加载玩家数据...</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let connected = false;
        let startTime = Date.now();
        
        // 连接WebSocket
        function connectWebSocket() {
            const wsUrl = `ws://${window.location.host}`;
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                connected = true;
                updateConnectionStatus();
                refreshData();
            };
            
            ws.onclose = () => {
                connected = false;
                updateConnectionStatus();
                setTimeout(connectWebSocket, 3000); // 重连
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket错误:', error);
            };
            
            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleServerMessage(message);
                } catch (error) {
                    console.error('消息解析错误:', error);
                }
            };
        }
        
        function handleServerMessage(message) {
            // 这里可以处理服务器推送的实时更新
            console.log('收到服务器消息:', message);
        }
        
        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (connected) {
                statusEl.textContent = '已连接';
                statusEl.className = 'connection-status connected';
            } else {
                statusEl.textContent = '连接断开';
                statusEl.className = 'connection-status disconnected';
            }
        }
        
        async function refreshData() {
            try {
                await Promise.all([
                    loadRooms(),
                    loadPlayers(),
                    updateStats()
                ]);
            } catch (error) {
                console.error('刷新数据失败:', error);
            }
        }
        
        async function loadRooms() {
            try {
                const response = await fetch('/api/rooms');
                const result = await response.json();
                
                if (result.success) {
                    displayRooms(result.rooms);
                    document.getElementById('roomCount').textContent = result.rooms.length;
                    document.getElementById('gameCount').textContent = 
                        result.rooms.filter(r => r.status === 'playing').length;
                }
            } catch (error) {
                document.getElementById('roomsList').innerHTML = 
                    '<div class="empty-state">加载房间失败</div>';
            }
        }
        
        async function loadPlayers() {
            // 这里可以添加获取玩家列表的API
            document.getElementById('playersList').innerHTML = 
                '<div class="empty-state">玩家数据通过WebSocket获取</div>';
        }
        
        function displayRooms(rooms) {
            const container = document.getElementById('roomsList');
            
            if (rooms.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无房间</div>';
                return;
            }
            
            container.innerHTML = rooms.map(room => `
                <div class="room-item">
                    <div class="room-header">
                        <span class="room-name">${room.name} (${room.id})</span>
                        <span class="room-status status-${room.status}">${getStatusText(room.status)}</span>
                    </div>
                    <div class="room-info">
                        模式: ${room.gameMode} | 
                        玩家: ${room.players}/${room.maxPlayers} |
                        ${room.isPrivate ? '🔒 私密房间' : '🌐 公开房间'}
                    </div>
                </div>
            `).join('');
        }
        
        function getStatusText(status) {
            const statusMap = {
                waiting: '等待中',
                playing: '游戏中',
                finished: '已结束'
            };
            return statusMap[status] || status;
        }
        
        function updateStats() {
            // 更新服务器运行时间
            const uptime = Date.now() - startTime;
            const hours = Math.floor(uptime / 3600000);
            const minutes = Math.floor((uptime % 3600000) / 60000);
            const seconds = Math.floor((uptime % 60000) / 1000);
            
            document.getElementById('uptime').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
            
            // 定期更新数据
            setInterval(refreshData, 10000);
            setInterval(updateStats, 1000);
        });
    </script>
</body>
</html>
